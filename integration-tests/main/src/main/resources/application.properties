# You can set the following properties if you don't use the default credentials and project ID
#quarkus.google.cloud.service-account-location=
#quarkus.google.cloud.project-id=

# Ensure we run the integration test as a separate docker image so we can test the shared network logic
quarkus.container-image.build=true

# We use a dummy test project id in test for the emulators to work
quarkus.google.cloud.project-id=test-project
quarkus.google.cloud.access-token-enabled=false
quarkus.google.cloud.storage.host-override=http://localhost:8089

# Written to target/shim/shim-report.txt at build time; FirestoreShimAppliedTest asserts on it to
# catch a shim silently never being applied (e.g. because its target isn't indexed) instead of
# only finding out via a runtime NoSuchMethodError on some rarely-exercised code path.
quarkus.shim.report=true

# Specific profile for pubsub push
%push.quarkus.google.cloud.pubsub.push.enabled=true
%push.quarkus.google.cloud.pubsub.push.audience=test-demo-audience
%push.quarkus.google.cloud.pubsub.push.endpoint-path=/pubsub-push-receiver
%push.quarkus.google.cloud.pubsub.push.verification-token=testtoken
%push.quarkus.google.cloud.pubsub.push.service-account-email=testme@google.com

# Specific profile for pubsub push
%push-e2e.quarkus.google.cloud.pubsub.push.enabled=true
%push-e2e.quarkus.google.cloud.pubsub.push.audience=test-demo-audience
%push-e2e.quarkus.google.cloud.pubsub.push.endpoint-path=/pubsub-push-receiver
%push-e2e.quarkus.google.cloud.pubsub.push.verification-token=testtoken
%push-e2e.quarkus.google.cloud.pubsub.push.service-account-email=testme@google.com
%push-e2e.quarkus.google.cloud.pubsub.push.disable-authentication=true
%push-e2e.quarkus.http.host=0.0.0.0

# Profile for testing that service-account-email resolves from a runtime env var (not baked in at build time).
# service-account-email is deliberately absent here; it is supplied only via QuarkusTestProfile.getConfigOverrides().
%push-runtime-config.quarkus.google.cloud.pubsub.push.enabled=true
%push-runtime-config.quarkus.google.cloud.pubsub.push.audience=test-demo-audience
%push-runtime-config.quarkus.google.cloud.pubsub.push.endpoint-path=/pubsub-push-receiver
%push-runtime-config.quarkus.google.cloud.pubsub.push.verification-token=testtoken

# Disable authentication for Bigtable on tests
bigtable.authenticated=false

# Use pubsub emulator
quarkus.google.cloud.pubsub.devservice.enabled=true
quarkus.google.cloud.firestore.devservice.enabled=true
quarkus.google.cloud.bigtable.devservice.enabled=true
quarkus.google.cloud.spanner.devservice.enabled=true

# Secret Manager Demo
# You can load secrets from Google Cloud Secret Manager with the ${sm//<SECRET_ID>} syntax.
#%prod.my.database.password=${sm//integration-test}
my.database.password=test
quarkus.google.cloud.secret-manager-enabled=false

## Logging config
%dev.quarkus.google.cloud.logging.enabled=false
quarkus.google.cloud.logging.default-log=test
quarkus.google.cloud.logging.default-label.app=test
quarkus.google.cloud.logging.resource.type=generic_node
quarkus.google.cloud.logging.resource.label.location=eu-north1
quarkus.google.cloud.logging.resource.label.namespace=test-nodes
quarkus.google.cloud.logging.resource.label.node_id=192.168.0.2
quarkus.google.cloud.logging.structured.stack-trace.included=true
quarkus.google.cloud.logging.gcp-tracing.enabled=false
quarkus.google.cloud.logging.format=json
